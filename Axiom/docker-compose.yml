services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom
      POSTGRES_DB: axiom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - axiom-db:/var/lib/postgresql/data
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://axiom:axiom@db:5432/axiom
      JWT_SECRET: local-development-secret-change-me-32-bytes
      CORS_ORIGINS: http://localhost:3000
      AXIOM_DEMO_API_KEY: ax_demo_local
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  axiom-db:
